version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. BANCO DE DADOS RELACIONAL & SÉRIES TEMPORAIS (Grupo 3 - MES/SQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: industria40-postgres
    restart: always
    environment:
      POSTGRES_DB: industria40_db
      POSTGRES_USER: admin_40
      POSTGRES_PASSWORD: senha_segura_40
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - industria40-net

  # ---------------------------------------------------------------------------
  # 2. EDGE COMPUTING & TRADUÇÃO DE PROTOCOLOS (Grupo 1 - IoT/CLP/Node-RED)
  # ---------------------------------------------------------------------------
  nodered:
    image: nodered/node-red:latest
    container_name: industria40-nodered
    restart: always
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - nodered_data:/data
    networks:
      - industria40-net
    depends_on:
      - postgres

  # ---------------------------------------------------------------------------
  # 3. FILA DE MENSAGERIA & TAREFAS DO ROBÔ (Grupo 2 - Cobot/Universal Robots)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: industria40-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Painel de Gerenciamento Web
    environment:
      RABBITMQ_DEFAULT_USER: user_40
      RABBITMQ_DEFAULT_PASS: senha_rabbitmq_40
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - industria40-net

networks:
  industria40-net:
    driver: bridge

volumes:
  postgres_data:
  nodered_data:
  rabbitmq_data:
